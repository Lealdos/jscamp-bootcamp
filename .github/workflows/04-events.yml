name: 04 - Events

on:
    issues:
        types: [opened, assigned]

    issue_comment:
        types: [created]

    pull_request_review_comment:

jobs:
    inspect-event:
        runs-on: ubuntu-24.04
        permissions:
            issues: write
        steps:
            - name: Inspeccionar el evento
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
              run: |
                  echo "Evento: $EVENT_NAME"
                  echo "Numero de la issue: $ISSUE_NUMBER"
                  echo "Comentario: $COMMENT_BODY"

            - name: Comentar en la issue recien abierta
              if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  AUTHOR: ${{ github.event.issue.user.login }}
              run: |
                  gh issue comment "$ISSUE_NUMBER" \
                    --repo "$GITHUB_REPOSITORY" \
                    --body "Gracias por tu aporte, @$AUTHOR! Hemos recibido tu issue y la revisaremos pronto."
