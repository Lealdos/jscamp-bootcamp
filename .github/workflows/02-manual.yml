name: 02 - Manual

on:
    workflow_dispatch:
        inputs:
            logging_level:
                description: "Nivel de log"
                required: true
                default: info
                type: choice
                options:
                    - debug
                    - info
                    - warning
                    - error

            environment:
                description: "Entorno de despliegue"
                required: true
                type: choice
                options:
                    - dev
                    - staging
                    - production

            dry_run:
                description: "Ejecutar sin aplicar cambios"
                required: false
                default: false
                type: boolean

            reason:
                description: "Motivo de la ejecucion"
                required: false
                default: "Manual execution"
                type: string

jobs:
    manual:
        runs-on: ubuntu-24.04
        steps:
            - name: Mostrar los inputs
              env:
                  LOGGING_LEVEL: ${{ inputs.logging_level }}
                  ENVIRONMENT: ${{ inputs.environment }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  REASON: ${{ inputs.reason }}
              run: |
                  echo "Logging level: $LOGGING_LEVEL"
                  echo "Environment: $ENVIRONMENT"
                  echo "Dry run: $DRY_RUN"
                  echo "Reason: $REASON"

            - name: Deploy
              if: ${{ !inputs.dry_run }}
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
              run: echo "Deploying to $ENVIRONMENT"

            - name: Dry run
              if: ${{ inputs.dry_run }}
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
              run: 'echo "Dry run: no se aplica ningun cambio en $ENVIRONMENT"'
